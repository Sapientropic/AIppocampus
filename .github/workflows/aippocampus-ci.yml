name: AIppocampus CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/aippocampus

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff
        run: ruff check . --config ../../pyproject.toml

      - name: Docs health
        run: python scripts/check_docs_health.py --json

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python files
        run: python -m compileall -q .
