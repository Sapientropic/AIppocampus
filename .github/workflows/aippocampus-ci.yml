name: AIppocampus CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install checks
        run: python -m pip install ruff mypy

      - name: Ruff
        run: ruff check skills plugins tests tools benchmarks benchmark_corpus

      - name: Type check
        run: mypy

      - name: Docs health
        run: python tools/aippocampus/docs/check_docs_health.py --json

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Compile Python files
        run: python -m compileall -q skills plugins tests tools benchmarks benchmark_corpus
