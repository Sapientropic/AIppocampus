name: AIppocampus CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff
        run: ruff check skills plugins tests tools benchmarks

      - name: Docs health
        run: python tools/aippocampus/docs/check_docs_health.py --json

      - name: Unit tests
        run: python -m unittest discover -s tests -t .

      - name: Compile Python files
        run: python -m compileall -q skills plugins tests tools benchmarks benchmark_corpus
