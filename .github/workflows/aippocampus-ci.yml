name: AIppocampus CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install checks
        run: python -m pip install ruff mypy coverage build

      - name: Editable install smoke
        run: |
          python -m pip install -e .
          python -c "import aippocampus_runtime; print('editable-install-ok')"
          mkdir -p .tmp/ci-codex-home
          aippocampus hooks status --codex-home .tmp/ci-codex-home --json
          aippocampus hooks install --codex-home .tmp/ci-codex-home --json
          aippocampus hooks status --codex-home .tmp/ci-codex-home --json

      - name: Build package metadata
        run: python -m build --sdist --wheel

      - name: Ruff
        run: ruff check skills plugins tests tools benchmarks benchmark_corpus

      - name: Type check
        run: mypy

      - name: Docs health
        run: python tools/aippocampus/docs/check_docs_health.py --json

      - name: Fast test tier with coverage
        run: |
          python -m coverage run --branch --source=skills/aippocampus/scripts,tools/aippocampus,plugins/aippocampus tools/aippocampus/run_tests.py --tier fast
          python -m coverage report -m
          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Compile Python files
        run: python -m compileall -q skills plugins tests tools benchmarks benchmark_corpus

  benchmark-smoke:
    name: Benchmark smoke (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install benchmark smoke dependencies
        run: python -m pip install -e ".[benchmark]"

      - name: Public-fast suite and deterministic benchmark smoke tier
        run: python tools/aippocampus/run_tests.py --tier benchmark-smoke --benchmark-suite-profile public-fast

  openai-agents-smoke:
    name: OpenAI Agents SDK smoke (optional integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install optional OpenAI Agents SDK dependency
        run: python -m pip install -e ".[openai-agents]"

      - name: Run OpenAI Agents SDK function-tool smoke
        run: python -m unittest tests.aippocampus.test_openai_agents_sdk_smoke -v

  macos-path-identity:
    name: macOS default TMPDIR path-identity smoke
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: |
          python -m pip install ruff mypy coverage build
          python -m pip install -e .

      - name: Capture default macOS temp identity
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tempfile

          tempdir = pathlib.Path(tempfile.gettempdir())
          print(f"default_tmpdir={tempdir}")
          print(f"default_tmpdir_resolved={tempdir.resolve()}")
          PY

      - name: Fast tier on default macOS tempdir
        shell: bash
        run: |
          # Covers recurring #140/#242/#402 /var and /private/var path-identity regressions.
          python tools/aippocampus/run_tests.py --tier fast

  full-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Full test tier
        run: python tools/aippocampus/run_tests.py --tier full
