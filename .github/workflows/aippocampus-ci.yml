name: AIppocampus CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: Checks and canonical PR coverage (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install checks
        run: python -m pip install -e ".[dev]"

      - name: Editable install smoke
        run: |
          python -c "import aippocampus_runtime; print('editable-install-ok')"
          mkdir -p .tmp/ci-codex-home
          aippocampus hooks status --codex-home .tmp/ci-codex-home --json
          aippocampus hooks install --codex-home .tmp/ci-codex-home --json
          aippocampus hooks status --codex-home .tmp/ci-codex-home --json

      - name: Build package metadata
        run: python -m build --sdist --wheel

      - name: Fresh-venv wheel contract
        run: python tools/aippocampus/release/check_wheel_contract.py --wheel dist/*.whl --json

      - name: Ruff
        run: ruff check skills plugins tests tools benchmarks benchmark_corpus

      - name: Type check
        run: mypy

      - name: Docs health
        run: python tools/aippocampus/docs/check_docs_health.py --json

      - name: PR closeout audit
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/aippocampus/github/closeout_audit.py --pr "$PR_NUMBER" --github-repo "${{ github.repository }}" --github-annotations

      - name: PR test tier with canonical coverage
        run: |
          mkdir -p benchmark_corpus/reports
          python -m coverage run --branch --source=skills/aippocampus/scripts,tools/aippocampus,plugins/aippocampus tools/aippocampus/run_tests.py --tier pr --timings-json benchmark_corpus/reports/pr-tier-timings.json
          python -m coverage report -m
          python -m coverage xml -o coverage.xml

      - name: Upload canonical coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pr-canonical
          path: coverage.xml
          if-no-files-found: ignore

      - name: Upload PR timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-pr-fast
          path: benchmark_corpus/reports/pr-tier-timings.json
          if-no-files-found: ignore

      - name: Compile Python files
        run: python -m compileall -q skills plugins tests tools benchmarks benchmark_corpus

  broad-pr:
    name: Broad deterministic pre-merge tier (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install checks
        run: python -m pip install -e ".[dev]"

      - name: Broad deterministic pre-merge shard
        run: |
          mkdir -p benchmark_corpus/reports
          python tools/aippocampus/run_tests.py --tier broad-pr --shard-index ${{ matrix.shard }} --shard-total 4 --timings-json benchmark_corpus/reports/broad-pr-shard-${{ matrix.shard }}.json

      - name: Upload broad-pr timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: timings-broad-pr-shard-${{ matrix.shard }}
          path: benchmark_corpus/reports/broad-pr-shard-${{ matrix.shard }}.json
          if-no-files-found: ignore

  required-checks-312:
    name: checks (3.12)
    runs-on: ubuntu-latest
    needs: [checks, broad-pr]
    if: ${{ always() }}

    steps:
      - name: Mirror canonical Python 3.12 ruleset context
        run: |
          if [ "${{ needs.checks.result }}" != "success" ]; then
            echo "Canonical Python 3.12 checks finished with: ${{ needs.checks.result }}"
            exit 1
          fi
          if [ "${{ needs.broad-pr.result }}" != "success" ]; then
            echo "Broad deterministic pre-merge tier finished with: ${{ needs.broad-pr.result }}"
            exit 1
          fi
          echo "Canonical Python 3.12 checks passed."

  python-compat:
    name: Python 3.13 quick compatibility tier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install compatibility dependencies
        run: python -m pip install -e ".[dev]"

      - name: Python 3.13 quick compatibility tier
        run: python tools/aippocampus/run_tests.py --tier quick

  required-checks-313:
    name: checks (3.13)
    runs-on: ubuntu-latest
    needs: python-compat
    if: ${{ always() }}

    steps:
      - name: Mirror Python 3.13 ruleset context
        run: |
          if [ "${{ needs.python-compat.result }}" != "success" ]; then
            echo "Python 3.13 compatibility tier finished with: ${{ needs.python-compat.result }}"
            exit 1
          fi
          echo "Python 3.13 compatibility tier passed."

  benchmark-smoke:
    name: Benchmark smoke (deterministic)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install benchmark smoke dependencies
        run: python -m pip install -e ".[benchmark]"

      - name: Restore deterministic benchmark cache
        uses: actions/cache@v4
        with:
          path: benchmark_corpus/.cache
          key: benchmark-standard-cache-${{ runner.os }}-${{ hashFiles('benchmarks/aippocampus/**/*.py', 'tests/aippocampus/test_benchmark*.py', 'tools/aippocampus/run_tests.py') }}
          restore-keys: |
            benchmark-standard-cache-${{ runner.os }}-

      - name: Public-fast suite and deterministic benchmark smoke tier
        run: python tools/aippocampus/run_tests.py --tier benchmark-smoke --benchmark-suite-profile public-fast

  openai-agents-smoke:
    name: OpenAI Agents SDK smoke (optional integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install optional OpenAI Agents SDK dependency
        run: python -m pip install -e ".[openai-agents-smoke]"

      - name: Run OpenAI Agents SDK function-tool smoke
        run: python -m unittest tests.aippocampus.test_openai_agents_sdk_smoke -v

  macos-path-identity:
    name: macOS default TMPDIR path-identity smoke
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install smoke dependencies
        run: python -m pip install -e ".[dev]"

      - name: Capture default macOS temp identity
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tempfile

          tempdir = pathlib.Path(tempfile.gettempdir())
          print(f"default_tmpdir={tempdir}")
          print(f"default_tmpdir_resolved={tempdir.resolve()}")
          PY

      - name: Focused path-identity modules on default macOS tempdir
        shell: bash
        run: |
          # Covers recurring #140/#242/#402 /var and /private/var path-identity regressions without repeating the full PR tier.
          python -m unittest tests.aippocampus.test_path_identity tests.aippocampus.test_run_tests_tiers tests.aippocampus.test_macos_install_smoke_workflow -v

  full-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Full test tier
        run: python tools/aippocampus/run_tests.py --tier full
