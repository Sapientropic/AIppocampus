name: AIppocampus CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install checks
        run: python -m pip install ruff mypy

      - name: Ruff
        run: ruff check skills plugins tests tools benchmarks benchmark_corpus

      - name: Type check
        run: mypy

      - name: Docs health
        run: python tools/aippocampus/docs/check_docs_health.py --json

      - name: Fast test tier
        run: python tools/aippocampus/run_tests.py --tier fast

      - name: Compile Python files
        run: python -m compileall -q skills plugins tests tools benchmarks benchmark_corpus

  full-tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Full test tier
        run: python tools/aippocampus/run_tests.py --tier full
