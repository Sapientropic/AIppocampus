name: Publish Python Package And MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to publish, for example v0.1.1"
        required: true
        type: string
      skip_pypi:
        description: "Skip PyPI upload when the package version is already published"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: pypi-mcp-registry-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      SKIP_PYPI: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_pypi || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_pypi && github.ref || (github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref) }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install release tools
        run: python -m pip install -e ".[release]"

      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          skip_pypi = os.environ.get("SKIP_PYPI", "false").lower() == "true"
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          tag_commit = subprocess.check_output(["git", "rev-list", "-n", "1", tag], text=True).strip()
          head_commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if tag_commit != head_commit and not skip_pypi:
              raise SystemExit(
                  f"checked-out commit {head_commit} does not match {tag} commit {tag_commit}"
              )
          if tag_commit != head_commit:
              print(f"tag {tag} matches version {version}; using current ref for MCP-only repair")
          else:
              print(f"tag {tag} matches pyproject version {version}")
          PY

      - name: Docs health
        run: python tools/aippocampus/docs/check_docs_health.py --json

      - name: PR tests
        run: python tools/aippocampus/run_tests.py --tier pr

      - name: Validate MCP Registry metadata
        run: check-jsonschema --schemafile https://raw.githubusercontent.com/modelcontextprotocol/registry/main/docs/reference/server-json/draft/server.schema.json server.json

      - name: Build package
        run: python -m build --sdist --wheel

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Smoke built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          aippocampus --help
          aippocampus mcp list-tools

      - name: Publish package to PyPI
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_pypi) }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate server with MCP Registry
        run: ./mcp-publisher validate server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish server.json
