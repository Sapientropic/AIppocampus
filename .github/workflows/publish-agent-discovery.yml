name: Publish Python Package And MCP Registry

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: pypi-mcp-registry-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tools
        run: python -m pip install --upgrade build twine check-jsonschema

      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")
          print(f"tag {tag} matches pyproject version {version}")
          PY

      - name: Docs health
        run: python tools/aippocampus/docs/check_docs_health.py --json

      - name: Fast tests
        run: python tools/aippocampus/run_tests.py --tier fast

      - name: Validate MCP Registry metadata
        run: check-jsonschema --schemafile https://raw.githubusercontent.com/modelcontextprotocol/registry/main/docs/reference/server-json/draft/server.schema.json server.json

      - name: Build package
        run: python -m build --sdist --wheel

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Smoke built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          aippocampus --help
          aippocampus mcp list-tools

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate server with MCP Registry
        run: ./mcp-publisher validate server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish server.json
