name: AIppocampus Full Test Tier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-tests:
    name: Full test tier
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install full test dependencies
        run: python -m pip install -e ".[dev,benchmark,openai-agents-smoke]"

      - name: Full test tier
        run: python tools/aippocampus/run_tests.py --tier full
