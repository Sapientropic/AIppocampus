name: Project triage

"on":
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Optional issue number to triage. Leave empty to backfill missing fields."
        required: false
      dry_run:
        description: "Print planned updates without mutating the Project."
        type: boolean
        default: false
      repair_managed_fields:
        description: "Repair high-confidence fields that look generated by the triage script. Use with dry_run first."
        type: boolean
        default: false
      assign_milestones:
        description: "Assign an inferred milestone only when an issue has none."
        type: boolean
        default: true

permissions:
  contents: read
  issues: read

jobs:
  project-triage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fill Project fields
        env:
          AIPPOCAMPUS_PROJECTS_TOKEN: ${{ secrets.AIPPOCAMPUS_PROJECTS_TOKEN }}
          AIPPOCAMPUS_PROJECT_OWNER: Sapientropic
          AIPPOCAMPUS_PROJECT_NUMBER: "1"
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          REPAIR_MANAGED_FIELDS: ${{ github.event.inputs.repair_managed_fields || 'false' }}
          ASSIGN_MILESTONES: ${{ github.event.inputs.assign_milestones || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AIPPOCAMPUS_PROJECTS_TOKEN:-}" ]]; then
            echo "::warning::Set repository secret AIPPOCAMPUS_PROJECTS_TOKEN with GitHub Projects and Issues write access to enable automatic Project field and Milestone triage."
            exit 0
          fi
          if [[ -z "${ASSIGN_MILESTONES:-}" ]]; then
            ASSIGN_MILESTONES=true
          fi

          args=(
            --repo "$GITHUB_REPOSITORY"
            --project-owner "$AIPPOCAMPUS_PROJECT_OWNER"
            --project-number "$AIPPOCAMPUS_PROJECT_NUMBER"
          )
          if [[ -n "${ISSUE_NUMBER:-}" ]]; then
            args+=(--issue-number "$ISSUE_NUMBER")
          elif [[ "$REPAIR_MANAGED_FIELDS" == "true" ]]; then
            args+=(--repair-managed-fields)
          else
            args+=(--all-missing)
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$REPAIR_MANAGED_FIELDS" == "true" && -n "${ISSUE_NUMBER:-}" ]]; then
            args+=(--repair-managed-fields)
          fi
          if [[ "$ASSIGN_MILESTONES" == "true" ]]; then
            args+=(--assign-milestones)
          fi
          python tools/aippocampus/github/project_triage.py "${args[@]}"
