[project]
name = "aippocampus"
version = "0.3.3"
description = "Source-backed continuity layer for long-running AI agent relationships."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "ai-agents",
    "agent-memory",
    "conversation-continuity",
    "local-first",
    "mcp",
    "source-backed-memory",
    "codex",
    "claude-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.aippocampus.com"
Repository = "https://github.com/Sapientropic/AIppocampus"
Issues = "https://github.com/Sapientropic/AIppocampus/issues"
Discussions = "https://github.com/Sapientropic/AIppocampus/discussions"
Documentation = "https://github.com/Sapientropic/AIppocampus/tree/main/docs"

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project.scripts]
aippocampus = "aippocampus_runtime.cli.facade:main"

[project.optional-dependencies]
# Runtime remains stdlib/package-local by default. The exact-pinned tooling
# extras below are reproducibility contracts for contributors and CI, not
# runtime requirements for local-first AIppocampus use.
dev = [
    "build==1.3.0",
    "coverage==7.14.1",
    "mypy==2.1.0",
    "ruff==0.15.12",
]
test-quality = [
    "hypothesis==6.155.7",
]
release = [
    "build==1.3.0",
    "check-jsonschema==0.37.2",
    "twine==6.2.0",
]
# Deterministic benchmark smoke currently uses stdlib plus checked-in public
# fixtures. Keep this empty extra as the stable contributor install target; add
# packages here only when a committed deterministic benchmark requires them.
benchmark = []
openai-agents = ["openai-agents>=0.17.4,<1"]
openai-agents-smoke = ["openai-agents==0.17.4"]

[tool.setuptools]
# The installable runtime intentionally lives under skills/aippocampus/scripts
# so the Codex skill bundle and PyPI package share one source tree.
package-dir = {"" = "skills/aippocampus/scripts"}
packages = [
    "aippocampus_runtime",
    "aippocampus_runtime.aippo",
    "aippocampus_runtime.artifacts",
    "aippocampus_runtime.cli",
    "aippocampus_runtime.coding",
    "aippocampus_runtime.config",
    "aippocampus_runtime.dream",
    "aippocampus_runtime.hooks",
    "aippocampus_runtime.journey",
    "aippocampus_runtime.knowledge",
    "aippocampus_runtime.learning_loop",
    "aippocampus_runtime.macro",
    "aippocampus_runtime.mcp",
    "aippocampus_runtime.model",
    "aippocampus_runtime.navigation",
    "aippocampus_runtime.onboarding",
    "aippocampus_runtime.ops",
    "aippocampus_runtime.ops.doctors",
    "aippocampus_runtime.question",
    "aippocampus_runtime.recall",
    "aippocampus_runtime.recall.ambient",
    "aippocampus_runtime.recall.feedback",
    "aippocampus_runtime.registry",
    "aippocampus_runtime.reflection",
    "aippocampus_runtime.source",
    "aippocampus_runtime.subconscious",
    "aippocampus_runtime.sync",
    "aippocampus_runtime.sync.encrypted",
    "aippocampus_runtime.sync.object_storage",
    "aippocampus_runtime.topology",
    "aippocampus_runtime.update",
    "aippocampus_runtime.vault",
    "aippocampus_runtime.vault.dashboard_assets",
    "aippocampus_runtime.warm_ambient",
    "conversation_sources",
]

[tool.setuptools.package-data]
# TOML dotted keys must stay quoted here. Without quotes, setuptools sees a
# nested `aippocampus_runtime = { vault = [...] }` table and editable installs
# fail before any package smoke can run.
"aippocampus_runtime.vault" = ["dashboard_assets/*.css", "dashboard_assets/*.js", "dashboard_assets/*.png"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "skills/aippocampus/scripts",
    "tests/aippocampus",
    "tools/aippocampus",
    "benchmarks/aippocampus",
    "benchmark_corpus",
    "plugins/aippocampus",
]
extend-exclude = [
    ".aippocampus",
    "graphify-out",
]

[tool.ruff.lint]
# Hard gate profile: keep broad style/docstring churn out of lint, but enforce
# syntax/runtime safety, Pyflakes, import order, and the first high-signal
# Bugbear tier. Advisory all-rule statistics stay opt-in through the command
# documented in the maintainer checks and release checklist.
select = ["E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = [
    "skills/aippocampus/scripts",
    "tools/aippocampus/docs",
    "tools/aippocampus/github",
    "tools/aippocampus/smoke",
    "plugins/aippocampus",
    "benchmarks/aippocampus",
]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
files = [
    "skills/aippocampus/scripts/aippocampus_runtime/core.py",
