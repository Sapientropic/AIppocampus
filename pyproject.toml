[tool.setuptools.package-data]
# TOML dotted keys must stay quoted here. Without quotes, setuptools sees a
# nested `aippocampus_runtime = { vault = [...] }` table and editable installs
# fail before any package smoke can run.
"aippocampus_runtime.vault" = ["dashboard_assets/*.css", "dashboard_assets/*.js"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "skills/aippocampus/scripts",
    "tests/aippocampus",
    "tools/aippocampus",
    "benchmarks/aippocampus",
    "benchmark_corpus",
    "plugins/aippocampus",
]
extend-exclude = [
    ".aippocampus",
    "graphify-out",
]

[tool.ruff.lint]
# Keep broad style churn out of lint, but enforce Pyflakes and import order so
# stale locals and flat same-directory imports do not hide real coupling debt.
select = ["E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
mypy_path = [
    "skills/aippocampus/scripts",
    "tools/aippocampus/docs",
    "tools/aippocampus/github",
    "tools/aippocampus/smoke",
    "plugins/aippocampus",
    "benchmarks/aippocampus",
]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
files = [
    "skills/aippocampus/scripts/aippocampuslib.py",
