[project]
name = "aippocampus"
version = "0.1.0"
description = "Source-backed continuity layer for long-running AI agent relationships."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "skills/aippocampus/scripts",
    "tests/aippocampus",
    "tools/aippocampus",
    "benchmarks/aippocampus",
    "benchmark_corpus",
    "plugins/aippocampus",
]
extend-exclude = [
    ".aippocampus",
    "graphify-out",
]

[tool.ruff.lint]
# Keep broad style churn out of lint, but enforce Pyflakes and import order so
# stale locals and flat same-directory imports do not hide real coupling debt.
select = ["E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
mypy_path = [
    "skills/aippocampus/scripts",
    "tools/aippocampus/smoke",
    "benchmarks/aippocampus",
]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
files = [
    "skills/aippocampus/scripts/aippocampuslib.py",
    "skills/aippocampus/scripts/aippocampus_health.py",
    "skills/aippocampus/scripts/aippocampus_lifecycle_hook.py",
