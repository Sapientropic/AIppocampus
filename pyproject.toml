[project]
name = "aippocampus"
version = "0.1.0"
description = "Source-backed continuity layer for long-running AI agent relationships."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
aippocampus = "aippocampus_cli:main"

[tool.setuptools]
package-dir = {"" = "skills/aippocampus/scripts"}
packages = ["conversation_sources"]
py-modules = [
    "active_recall",
    "agency_affordance",
    "aippocampus_cli",
    "aippocampus_health",
    "aippocampus_lifecycle_hook",
    "aippocampus_maintenance",
    "aippocampus_mcp_server",
    "aippocampus_prompt_hook",
    "aippocampuslib",
    "ambient_recall_cards",
    "ambient_thread_cache",
    "ambient_warm_scheduler",
    "append_anchor",
    "artifact_publish",
    "build_associations",
    "build_clean_source",
    "build_cognitive_map",
    "build_concept_graph",
    "build_index",
    "build_project_timeline",
    "build_segments",
    "build_semantic_scope_labels",
    "checkpoint",
    "coding_decision_events",
    "cold_archive",
    "compensatory_dream",
    "correction_reconsolidation",
    "deepseek_model_routing",
    "diagnose_hooks",
    "dream_input_pack",
    "dream_live_shadow_ab",
    "dream_natural_prompt_eval",
    "dream_real_history_eval",
    "dream_working_memory",
    "encrypted_sync_admin",
    "encrypted_sync_bundle",
    "encrypted_sync_crypto",
    "encrypted_sync_keys",
    "encrypted_sync_migration",
    "encrypted_sync_object_storage",
    "export_bundle",
    "import_bundle",
    "install_aippocampus_lifecycle_hook",
    "install_aippocampus_prompt_hook",
    "journey_tracking",
    "latest_reply",
    "locate_rollout",
    "memory_candidate_router",
    "model_client",
    "object_storage_client",
    "object_storage_providers",
    "onboard",
    "onboard_codex",
    "onboard_frontier",
    "onboard_status",
    "prepare_graphify_corpus",
    "privacy_projection",
    "prompt_context_render",
    "prompt_cues",
    "prompt_recall_ambient",
    "prompt_recall_ambiguity",
    "prompt_recall_budget",
    "prompt_recall_context",
    "prompt_recall_core",
    "prompt_recall_decision",
    "prompt_recall_evidence",
    "prompt_recall_semantic",
    "question_source_refs",
    "question_tracking",
    "question_vector_index",
    "reflection_space",
    "registry",
    "registry_provider",
    "registry_search",
    "registry_store",
    "retention_report",
    "retrieval",
    "retrieval_query_policy",
    "retrieval_score_fusion",
    "rollout_size_audit",
    "search_clean_source",
    "search_rollout",
    "search_segments",
    "semantic_cue_cache",
    "semantic_recall_gate",
    "semantic_scope_labels",
    "semantic_scope_source_review_core",
    "semantic_scope_suppressed_recovery",
    "semantic_trigger_router",
    "storage_capacity_report",
    "subconscious_agent",
    "subconscious_deterministic_jobs",
    "subconscious_job_circuits",
    "subconscious_job_plan",
    "subconscious_job_validation",
    "subconscious_jobs",
    "subconscious_jobs_config",
    "subconscious_review",
    "subconscious_runtime",
    "subconscious_scheduler",
    "subconscious_tool_loop",
    "subconscious_worker",
    "sync_bundle",
    "sync_contract",
    "sync_object_storage",
    "sync_vault",
    "vault_dashboard",
    "vault_notes",
    "vault_sync_utils",
    "warm_ambient_prompting",
    "warm_ambient_recall",
    "warm_ambient_scout_profiles",
    "warm_ambient_source_validation",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "skills/aippocampus/scripts",
    "tests/aippocampus",
    "tools/aippocampus",
    "benchmarks/aippocampus",
    "benchmark_corpus",
    "plugins/aippocampus",
]
extend-exclude = [
    ".aippocampus",
    "graphify-out",
]

[tool.ruff.lint]
# Keep broad style churn out of lint, but enforce Pyflakes and import order so
# stale locals and flat same-directory imports do not hide real coupling debt.
select = ["E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
mypy_path = [
    "skills/aippocampus/scripts",
    "tools/aippocampus/docs",
    "tools/aippocampus/github",
    "tools/aippocampus/smoke",
    "plugins/aippocampus",
    "benchmarks/aippocampus",
]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
files = [
    "skills/aippocampus/scripts/aippocampuslib.py",
