[project]
name = "aippocampus"
version = "0.1.0"
description = "Source-backed continuity layer for long-running AI agent relationships."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
    "skills/aippocampus/scripts",
    "tests/aippocampus",
    "tools/aippocampus",
    "benchmarks/aippocampus",
    "benchmark_corpus",
    "plugins/aippocampus",
]
extend-exclude = [
    ".aippocampus",
    "graphify-out",
]

[tool.ruff.lint]
# Keep broad style churn out of lint, but enforce Pyflakes and import order so
# stale locals and flat same-directory imports do not hide real coupling debt.
select = ["E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
mypy_path = "skills/aippocampus/scripts"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true
files = [
    "skills/aippocampus/scripts/aippocampuslib.py",
    "skills/aippocampus/scripts/aippocampus_health.py",
    "skills/aippocampus/scripts/build_clean_source.py",
    "skills/aippocampus/scripts/build_cognitive_map.py",
    "skills/aippocampus/scripts/deepseek_model_routing.py",
    "skills/aippocampus/scripts/model_client.py",
    "skills/aippocampus/scripts/prompt_context_render.py",
    "skills/aippocampus/scripts/prompt_cues.py",
    "skills/aippocampus/scripts/prompt_recall_context.py",
    "skills/aippocampus/scripts/prompt_recall_decision.py",
    "skills/aippocampus/scripts/registry.py",
    "skills/aippocampus/scripts/registry_store.py",
    "skills/aippocampus/scripts/search_clean_source.py",
    "skills/aippocampus/scripts/semantic_recall_gate.py",
    "skills/aippocampus/scripts/semantic_scope_labels.py",
    "skills/aippocampus/scripts/subconscious_agent.py",
    "skills/aippocampus/scripts/subconscious_job_plan.py",
    "skills/aippocampus/scripts/subconscious_job_validation.py",
    "skills/aippocampus/scripts/subconscious_jobs.py",
    "skills/aippocampus/scripts/subconscious_runtime.py",
    "skills/aippocampus/scripts/subconscious_tool_loop.py",
    "skills/aippocampus/scripts/sync_bundle.py",
    "skills/aippocampus/scripts/sync_object_storage.py",
]
